
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar estudios - Clínica</title>
    <link rel="stylesheet" href="../general/estilos.css">
</head>
<body>

<header>
    <div class="logo">Clínica</div>

    <nav>
        <a href="menu_principal.html">Menú principal</a>
        <a href="gestionar_exposiciones.html">Exposiciones</a>
        <a href="gestionar_trabajos.html">Trabajos</a>
        <a href="gestionar_relaciones.html">Relaciones</a>
        <a href="gestionar_estudios.html">Estudios</a>
    </nav>

    <button type="button" id="btn-tema">🌙 Modo oscuro</button>
</header>

<main class="gestion-contenido">

    <section class="bienvenida">
        <h1>Administrar estudios</h1>
        <p>Registrá y mantené actualizado el catálogo de estudios médicos.</p>
    </section>

    <section class="tarjeta">
        <h2>Agregar estudio</h2>

        <form class="form-gestion" method="post">

            <div class="campo">
                <label for="nombre_es">Nombre del estudio</label>
                <input
                    type="text"
                    id="nombre_es"
                    name="nombre_es"
                    maxlength="50"
                    placeholder="Ej.: Radiografía"
                    required
                >
            </div>

            <button type="submit">Guardar estudio</button>

        </form>
    </section>

    <section class="tarjeta">
        <h2>Estudios registrados</h2>

        <div class="tabla-contenedor">
            <table class="tabla-gestion">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Radiografía</td>
                        <td class="acciones">
                            <button type="button" class="btn-secundario">
                                Editar
                            </button>

                            <button type="button" class="btn-eliminar">
                                Eliminar
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td>Análisis de sangre</td>
                        <td class="acciones">
                            <button type="button" class="btn-secundario">
                                Editar
                            </button>

                            <button type="button" class="btn-eliminar">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    <span>Clínica</span>
    <span>Administración de estudios</span>
</footer>

<script src="../general/script.js"></script>
<script src="../general/modooscuro.js"></script>
<script src="../general/animaciones.js"></script>

</body>
</html>
