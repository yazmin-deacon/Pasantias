
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión - Clínica</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="login-page">
            
            <button type="button" id="btn-tema">
                Modo oscuro
            </button>

    <main class="login-container">

        <section class="tarjeta login">
            

            <div class="login-logo">
                
                <img id="logo" src="img/Logo minimalista DUCCA con hojas orgánicas.png" alt="" height="200" width="225">

            </div>
            
            <div class="login-separador">
                
            </div>

            <h2>INICIO DE SESIÓN</h2>

            <p class="login-descripcion"> </p>

            <form action="login.php" method="POST">

                <div class="campo">
                    <label for="nombre">Nombre Completo:</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingrese su nombre"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="dni">DNI:</label>

                    <input
                        type="text"
                        id="dni"
                        name="dni"
                        placeholder="Ingrese su DNI"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ingrese su correo"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña:</label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    INICIAR SESIÓN
                </button>

            </form>

            <p class="login-seguridad">

            </p>

        </section>

    </main>

    <footer class="login-footer">
        <p>Proyecto Web Clínica - EPET N°20 (2026)</p>
    </footer>

    <script src="JS/modooscuro.js"></script>

</body>
</html>
