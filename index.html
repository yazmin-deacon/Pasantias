<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Clínica - EPET N°20</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Encabezado con perfil de usuario -->
    <header>
        <div class="logo">
            <span>🩺</span> GESTIÓN MÉDICA - CLÍNICA
        </div>

        <nav>
            <a href="#">Inicio</a> |
            <a href="#">Pacientes</a> |
            <span class="perfil-usuario">
                Usuario: <strong>Doctora</strong>
            </span>
            <button type="button" id="btn-tema">
                Modo oscuro
            </button>
        </nav>
    </header>

    <main>

        <div class="contenedor-pacientes">

            <!-- Formulario para agregar pacientes -->
            <section class="tarjeta agregar-paciente">

                <h2>AGREGAR PACIENTE</h2>

                <form id="form-paciente" action="alta.php" method="POST">

                    <div class="campo">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>

                    <div class="campo">
                        <label for="dni">DNI (Único):</label>
                        <input type="number" id="dni" name="dni" required>
                    </div>

                    <div class="campo">
                        <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
                        <input type="date" id="fecha-nacimiento" name="fechaNacimiento" required>
                    </div>

                    <div class="campo">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion">
                    </div>

                    <div class="campo">
                        <label for="obra-social">Obra social:</label>
                        <input type="text" id="obra-social" name="obraSocial" required>
                    </div>
                    
                    <div class="campo">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>
                    
                    <div class="campo">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>



                    <!-- Datos laborales y exposiciones -->
                    <div class="campo">
                        <label for="empresa">Trabajo:</label>
                        <input type="text" id="empresa" name="empresa">
                    </div>

                    <div class="campo">
                        <label for="exposiciones">Exposiciones Laborales:</label>

                        <select id="exposiciones" name="exposiciones[]" multiple>
                            <option value="ruido">Ruidos Molestos (Genera Audiometría)</option>
                            <option value="quimicos">Sustancias Químicas (Genera Análisis de Sangre)</option>
                            <option value="polvo">Polvo / Partículas (Genera Placa de Tórax)</option>
                        </select>
                    </div>

                    <button type="submit">[ AGREGAR PACIENTE ]</button>

                </form>

            </section>


            <!-- Lista general de pacientes -->
            <section class="tarjeta lista-pacientes">

                <h2>PACIENTES</h2>

                <ul id="lista-pacientes-db">
                    <!-- Los pacientes se cargarán desde la base de datos -->
                </ul>

            </section>

        </div>


        <!-- Acciones rápidas y estudios -->
        <section class="tarjeta acciones-rapidas">

            <h2>ACCIONES RÁPIDAS Y ESTUDIOS</h2>

            <!-- Buscador de pacientes -->
            <div class="bloque-buscador">

                <label for="buscar-paciente">Buscar Paciente:</label>

                <input type="text" id="buscar-paciente" placeholder="Ingrese DNI o Apellido...">

                <button type="button" id="btn-buscar">[ BUSCAR ]</button>

            </div>

            <div class="separador-bloque"></div>


            <!-- Agregar estudio manual -->
            <div class="bloque-estudio-manual">

                <h3>Agregar Estudio Manual (Solo Doctora)</h3>

                <form id="form-estudio-manual" action="agregar_examen.php" method="POST">

                    <div class="campo">
                        <label for="dni-paciente-estudio">DNI Paciente:</label>
                        <input type="text" id="dni-paciente-estudio" name="dniPaciente" required>
                    </div>

                    <div class="campo">
                        <label for="nombre-estudio">Estudio:</label>
                        <input type="text" id="nombre-estudio" name="nombreEstudio"
                            placeholder="Ej: Ecografía abdominal" required>
                    </div>

                    <button type="submit">[ AGREGAR ESTUDIO MANUAL ]</button>

                </form>

            </div>

            <div class="separador-bloque"></div>


            <!-- Completar estudio pendiente -->
            <div class="bloque-completar-estudio">

                <h3>Completar Estudio Pendiente</h3>

                <form id="form-completar-estudio" action="completar_estudio.php" method="POST"
                    enctype="multipart/form-data">

                    <div class="campo">
                        <label for="id-estudio">ID Estudio:</label>
                        <input type="number" id="id-estudio" name="idEstudio" required>
                    </div>

                    <div class="campo">
                        <label for="fecha-realizado">Fecha Realizado:</label>
                        <input type="date" id="fecha-realizado" name="fechaRealizado" required>
                    </div>

                    <div class="campo">
                        <label for="observaciones">Observaciones:</label>
                        <input type="text" id="observaciones" name="observaciones">
                    </div>

                    <div class="campo">
                        <label for="archivo-estudio">Adjuntar Archivo (PDF/Imagen):</label>
                        <input type="file" id="archivo-estudio" name="archivo" accept=".pdf, image/*" required>
                    </div>

                    <button type="submit">[ GUARDAR RESULTADO ]</button>

                </form>

            </div>

        </section>

    </main>


    <!-- Próximos turnos y estudios -->
    <aside>

        <h2>📅 PRÓXIMOS TURNOS / ESTUDIOS</h2>

        <ul class="lista-turnos" id="lista-turnos-db">

            <!-- Los turnos se cargarán desde la base de datos -->

        </ul>

    </aside>


    <!-- Pie de página -->
    <footer>

        <p>Proyecto Web Clínica - EPET N°20 (2026)</p>

    </footer>


    <!-- Archivos JavaScript -->
    <script src="script.js"></script>
    <script src="animaciones.js"></script>
    <script src="modooscuro.js"></script>

</body>

</html>
